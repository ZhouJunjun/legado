// 国内镜像加速 —— Gradle 初始化脚本（legado 版）
//
// 用法（pack.sh 会自动传）：
//   gradle assembleRelease --init-script gradle/domestic-mirrors.init.gradle
//   gradle ... -Dmirror.debug=1        # 打印最终仓库顺序
//
// 为什么用 init 脚本而不是改 settings.gradle：
//   工程里的仓库声明保持原样，镜像只在本机构建时前置，代码评审和上游同步都不受影响。
//
// 做什么：
//   1. pluginManagement / dependencyResolutionManagement 两个仓库列表：
//      「本地 R8 仓库 → 阿里云镜像 → 原仓库」，镜像命中就直接用，
//      镜像里没有的构件会落到原仓库兜底，所以不会出现某个依赖镜像缺版本就编不过。
//   2. pluginManagement.buildscript：只前置本地 R8 仓库。legado 在这一层写死了
//      com.android.tools:r8:9.1.29，仓库是 storage.googleapis.com/r8-releases/raw
//      （国内基本不可达，各镜像均无此构件），只能靠 init_env.sh 预置到
//      $PREFIX/legado-maven，再用 file:// 仓库喂给 Gradle。
//
// 🔴 关于 jitpack（这是 legado "卡在下载" 的主因，nextplayer 没有这个问题）：
//   legado 有 12 个 com.github.* 依赖，它们的正确来源是 **jitpack**：
//     LyricViewX / quick-transfer-core / glide-svg / LiveEventBus /
//     renderscript-intrinsics-replacement-toolkit ……
//   而阿里云 public 里也有部分 com.github.*（glide、glide-compose、zxing-lite），
//   所以「统一把所有 com.github.* 都推给 jitpack」是错的，会 404。
//
//   正确做法是**按 group 精确路由**：
//     · 已知只在 jitpack 上的 → 直接给它 content filter，跳过 3 个阿里云镜像的空跑
//     · 已知阿里云也有的（glide 系 / zxing-lite）→ 不加 filter，让它走阿里云（更快）
//   这样 jitpack 只被真正需要它的 group 命中，其余仍享受镜像加速。
//
//   靠 includeGroupByRegex 限定后，Gradle 对不匹配的仓库**直接跳过、不发请求**，
//   这才是真正的省时点 —— 之前 12 个依赖 × 3 个镜像 × 404 的空转没了。

def DEBUG = System.getProperty('mirror.debug') != null

def MIRROR_URLS = [
    'https://maven.aliyun.com/repository/google',        // google() 的镜像（AndroidX / AGP / Compose）
    'https://maven.aliyun.com/repository/public',        // mavenCentral() + jcenter 的镜像
    'https://maven.aliyun.com/repository/gradle-plugin', // gradlePluginPortal() 的镜像
]

// 🔴 只在 jitpack 上、阿里云 public 返回 404 的 group。
//    已逐个实测（.pom 与 .aar 都试过）：
//      com.github.Moriafly:LyricViewX:1.3.2                                jit=200(.aar)  ali=404
//      com.github.liuyueyi.quick-chinese-transfer:quick-transfer-core      jit=200        ali=404
//      com.github.qoqa:glide-svg:4.0.2                                     jit=200(.aar)  ali=404
//      com.github.michaellee123:LiveEventBus:1.8.14                        jit=200(.aar)  ali=404
//      com.github.TomasValenta:renderscript-intrinsics-replacement-toolkit jit=200        ali=404
//    这些必须直接给 jitpack，否则要先被 3 个阿里云仓库各拒一次（每个 ~0.2s×3×12 = 可观）。
def JITPACK_ONLY_GROUPS = [
    'com\\.github\\.Moriafly',
    'com\\.github\\.liuyueyi',
    'com\\.github\\.qoqa',
    'com\\.github\\.michaellee123',
    'com\\.github\\.TomasValenta',
]

// 以下 com.github.* 阿里云 public **确实有**（实测 200），不加 jitpack 过滤，让它走镜像：
//   com.github.bumptech.glide   —— glide / recyclerview-integration / compiler / compose / ksp / avif
//   com.github.jenly1314        —— zxing-lite（jitpack 上是 404，只能走阿里云）

// 改写仓库列表：本地仓库 + 阿里云镜像在前，原仓库（含 jitpack）全部留作兜底。
//
// 🔴 这里是「卡在下载」的真正解法，核心只有一条：
//   阿里云 public 是 mavenCentral 的**全量代理**，它对任何 group 都接。
//   而 legado 有 5 个 group 只在 jitpack 上有（见 JITPACK_ONLY_GROUPS）。
//   如果不给 public 加 exclude，解析这些 group 时 Gradle 要先把 public 问一遍
//   （404）、再问 plugin portal（404），才轮到 jitpack —— 每个依赖多两次往返。
//   叠加 Gradle 默认 30s 超时与多轮重试，就是「卡在下载十几分钟」的观感。
//
//   所以只对 public 做**排除**（黑名单），不做白名单 include：
//     · 黑名单只排那几个确实不在 public 上的 group，绝不会误伤别的库
//     · 其余仓库保持原样（不限 group），兜底能力最强
//   这比「白名单精确路由」安全得多 —— 白名单一旦漏一个 group，
//   那个依赖就再也找不到，直接构建失败。
def rewriteAll = { repositories, String tag ->
    def originals = repositories.toList()

    repositories.clear()

    MIRROR_URLS.eachWithIndex { mirrorUrl, index ->
        repositories.maven { repo ->
            repo.name = "mirror-${index}-${tag}"
            repo.url = mirrorUrl
            // 只给 public（index 1）加排除：它是全量代理，会把 jitpack-only 的组也接过来
            if (index == 1) {
                repo.content {
                    JITPACK_ONLY_GROUPS.each { g -> excludeGroupByRegex g }
                }
            }
        }
    }

    // 原仓库全部留作兜底（google/mavenCentral/jitpack/本地 third_party 都在这里面）
    originals.each { repositories.add(it) }

    if (DEBUG) {
        println "[mirror] ${tag}:"
        repositories.toList().each { r ->
            println "   ${r.name} = ${r.url}"
        }
    }
}

settingsEvaluated { settings ->
    rewriteAll(settings.pluginManagement.repositories, 'plugin')
    rewriteAll(settings.dependencyResolutionManagement.repositories, 'deps')
}
